extends: ./electron-builder.base.yml
appId: com.differentai.openwork
productName: OpenWork Enterprise
extraMetadata:
  openworkDistribution: enterprise
protocols:
  - name: OpenWork Enterprise
    schemes:
      - uwork
publish:
  - provider: github
    owner: different-ai
    repo: openwork
    releaseType: release
    channel: enterprise
linux:
  executableName: openwork-enterprise
artifactName: openwork-enterprise-${os}-${arch}-${version}.${ext}
