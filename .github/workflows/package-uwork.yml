name: package-uwork

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Platforms to package (comma-separated: windows,linux,linux-arm64,all)"
        required: true
        default: "all"

concurrency:
  group: package-uwork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          all='[
            { "key": "windows", "name": "windows-x64", "os": "windows-latest" },
            { "key": "linux", "name": "linux-x64", "os": "ubuntu-24.04" },
            { "key": "linux-arm64", "name": "linux-arm64", "os": "ubuntu-24.04-arm" }
          ]'
          if [ "$TARGETS" = "all" ]; then
            selected="$all"
          else
            selected="$(echo "$all" | jq -c --arg targets "$TARGETS" '
              ($targets | split(",")) as $wanted
              | map(select(.key as $k | $wanted | any(. == $k)))
            ')"
          fi
          if [ "$selected" = "[]" ]; then
            echo "No valid targets in: $TARGETS" >&2
            exit 1
          fi
          echo "matrix={\"include\": $(echo "$selected" | jq -c .)}" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.name }}
    needs: select
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be installed BEFORE setup-node so setup-node can find the
      # pnpm binary on PATH. Matches the pattern in build-electron-desktop.yml.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      # Lockfile pins better-sqlite3 as a git dependency; pnpm clones it via
      # SSH by default, which fails on runners without a key. Rewrite to HTTPS.
      - name: Rewrite GitHub SSH URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Electron desktop (installer)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ""
          CSC_KEY_PASSWORD: ""
          OPENWORK_DESKTOP_SENTRY_DSN: ${{ secrets.OPENWORK_DESKTOP_SENTRY_DSN || vars.OPENWORK_DESKTOP_SENTRY_DSN }}
          OPENWORK_DESKTOP_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.OPENWORK_DESKTOP_SENTRY_TRACES_SAMPLE_RATE || '0.01' }}
        run: pnpm --filter @openwork/desktop package:electron

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uwork-${{ matrix.name }}
          path: |
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.zip
            apps/desktop/dist-electron/*.AppImage
            apps/desktop/dist-electron/*.deb
            apps/desktop/dist-electron/*.rpm
            apps/desktop/dist-electron/*.blockmap
            apps/desktop/dist-electron/latest*.yml
          if-no-files-found: warn
          retention-days: 14
